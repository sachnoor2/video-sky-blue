name: render

on:
  workflow_dispatch:
    inputs:
      seconds_per_frame:
        description: "Runner-only fallback: measured seconds per frame (raise it, never lower it)"
        required: true
        default: "9.0"

jobs:
  voice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Piper and the Hindi voice
        run: |
          mkdir -p .piper && cd .piper
          curl -fsSL -o piper.tar.gz https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_linux_x86_64.tar.gz
          tar -xzf piper.tar.gz
          ID=hi_IN-pratham-medium
          curl -fsSL -o $ID.onnx "https://huggingface.co/rhasspy/piper-voices/resolve/main/hi/hi_IN/pratham/medium/$ID.onnx"
          curl -fsSL -o $ID.onnx.json "https://huggingface.co/rhasspy/piper-voices/resolve/main/hi/hi_IN/pratham/medium/$ID.onnx.json"
      - name: Narration
        run: |
          pip install -q imageio-ffmpeg
          python scripts/hinglish_voice.py --script narration.json --out public/audio --piper .piper/piper/piper --voice .piper/hi_IN-pratham-medium.onnx
      - uses: actions/upload-artifact@v4
        with:
          name: voice
          path: |
            public/audio
            src/manifest.json

  plan:
    needs: voice
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      frames: ${{ steps.frames.outputs.total }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: voice
      - name: Shot list from the measured narration
        run: python3 scripts/build_shotlist.py --manifest src/manifest.json --plan shotplan.json --out shotlist.json
      - id: frames
        run: echo "total=$(python3 -c "import json;print(json.load(open('shotlist.json'))['totalFrames'])")" >> "$GITHUB_OUTPUT"
      - id: plan
        run: echo "shards=$(python3 scripts/plan_shards.py --seconds-per-frame ${{ inputs.seconds_per_frame }} --json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: plan
          path: |
            shotlist.json
            shards.json

  detect:
    needs: plan
    runs-on: ubuntu-latest
    outputs:
      lightning: ${{ steps.key.outputs.lightning }}
    steps:
      - id: key
        env:
          KEY: ${{ secrets.LIGHTNING_AI_API_KEY }}
        run: |
          if [ -n "$KEY" ]; then echo "lightning=yes" >> "$GITHUB_OUTPUT"
          else echo "lightning=no" >> "$GITHUB_OUTPUT"; fi

  stills:
    needs: plan
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: plan
      - name: Blender
        run: sudo apt-get update -qq && sudo apt-get install -y -qq blender
      - name: Build the world
        run: blender -b -P scenes/make_world.py -- --shotlist shotlist.json --out scenes/world.blend
      - name: One frame per shot
        run: |
          python3 - <<'EOF'
          import json, subprocess
          cfg = json.load(open("shotlist.json"))
          for s in cfg["shots"]:
              mid = (s["start"] + s["end"]) // 2
              subprocess.run(["blender", "-b", "scenes/world.blend", "-P", "scenes/render.py", "--",
                              "--camera", s["camera"], "--start", str(mid), "--end", str(mid),
                              "--out", "public/stills", "--samples", "12"], check=True)
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stills
          path: public/stills/frame_*.png
          if-no-files-found: warn

  # The film renders on a Lightning AI Studio: one machine, the whole frame range, the same world file.
  render-lightning:
    needs: [plan, detect]
    if: needs.detect.outputs.lightning == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: plan
      - run: pip install -q lightning-sdk
      - name: Render on Lightning AI
        env:
          LIGHTNING_API_KEY: ${{ secrets.LIGHTNING_AI_API_KEY }}
          LIGHTNING_USERNAME: ${{ secrets.LIGHTNING_USERNAME }}
          LIGHTNING_TEAMSPACE: ${{ secrets.LIGHTNING_TEAMSPACE }}
          LIGHTNING_ORG: ${{ secrets.LIGHTNING_ORG }}
        run: |
          python3 scripts/render_on_lightning.py --shotlist shotlist.json \
            --start 0 --end $(( ${{ needs.plan.outputs.frames }} - 1 ))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frames-lightning
          path: public/out/frame_*.png
          if-no-files-found: warn

  # Fallback only, when no Lightning key is configured: Cycles on the runner, sharded.
  render:
    needs: [plan, detect]
    if: needs.detect.outputs.lightning != 'yes'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
      max-parallel: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: plan
      - name: Blender
        run: sudo apt-get update -qq && sudo apt-get install -y -qq blender
      - name: Build the world
        run: blender -b -P scenes/make_world.py -- --shotlist shotlist.json --out scenes/world.blend
      - name: Render shard
        run: python3 scripts/render_shard.py --start ${{ matrix.shard.start }} --end ${{ matrix.shard.end }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frames-${{ matrix.shard.index }}
          path: public/out/frame_*.png
          if-no-files-found: warn

  assemble:
    needs: [voice, plan, render, render-lightning]
    if: ${{ !cancelled() && (needs.render.result == 'success' || needs.render-lightning.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          pattern: frames-*
          merge-multiple: true
          path: public/out
      - uses: actions/download-artifact@v4
        with:
          name: voice
      - uses: actions/download-artifact@v4
        with:
          name: plan
      - name: Install
        run: if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - run: npx tsc --noEmit
      - run: python3 scripts/stitch.py
      - run: python3 scripts/qa.py
      - uses: actions/upload-artifact@v4
        with:
          name: video
          path: |
            out/video.mp4
            qa.log
          if-no-files-found: error
          retention-days: 14
